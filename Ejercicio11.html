<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de Kilómetros a millas</title>
    <link rel="Stylesheet" href="css/Ejercicio11.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="Stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Calculadora</h1>
        <p class="subtitulo">Calculadora de Kilómetros a millas</p>

        <form class="formulario">
            <div class="grupo-formulario">
                <label for="kilometros">Distancia en Kilómetros</label>
                <input type="number" id="kilometros" placeholder="Ej: 2km">
            </div>  
            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="millas">Millas</label>
                    <input type="number" id="millas" placeholder="6.21371" readonly>    
                </div>   
                <button type="button" onclick="calcular()">Convertir</button>
            </div>
        </form>
    </div>
    <script src="js/Ejercicio11.js"></script>
</body>
</html>
